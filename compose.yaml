# Прод-стек: Cloudflare Tunnel → gunicorn/Django → Postgres + Redis (кеш). PDF і обкладинки — у R2.
# TLS закінчується на Cloudflare; назовні не публікується жоден порт — сервер у домашній
# мережі, а 80/443 на ньому можуть бути зайняті іншими проєктами.
#
# ${...} підставляються з .env у корені — на сервері це symlink: ln -s PDF+/.env .env
# Міграції — окремим кроком у deploy.sh, не при старті контейнера.

name: pdfplus

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:?PG_DB не задано в .env}
      POSTGRES_USER: ${PG_USER:?PG_USER не задано в .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD не задано в .env}
      # Та сама локаль, що локально: з C кирилиця не складається в lower()/ILIKE.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=uk-UA"
    volumes:
      # З Postgres 18 образ тримає дані в /var/lib/postgresql/18/docker —
      # монтувати батьківську теку, а не старий шлях .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Кеш Django (зараз — лічильники throttle входу, спільні для воркерів gunicorn).
    image: redis:8.2-alpine
    restart: unless-stopped
    # Лише кеш: на диск нічого не пишемо, при переповненні викидаємо найдавніше використане.
    # Рестарт скидає лічильники throttle — це прийнятно.
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: pdfplus-web
    restart: unless-stopped
    env_file: PDF+/.env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Портів назовні нема: доступ лише через tunnel.

  tunnel:
    # Версію фіксуємо: оновлення cloudflared — свідомий крок, а не сюрприз при pull.
    image: cloudflare/cloudflared:2026.2.0
    restart: unless-stopped
    # http2 замість QUIC за замовчуванням: на домашньому Wi-Fi/роутері QUIC (UDP) рвався
    # з «timeout: no recent network activity» — так падав тунель Prompt-trainer.
    command: tunnel --protocol http2 --metrics 0.0.0.0:2000 run
    environment:
      # Маршрут pdf-share.website → http://web:8000 задається в кабінеті Cloudflare
      # (Zero Trust → Tunnels → Public hostname), токен лише прив'язує конектор.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN не задано в .env}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      # Два конектори одного тунелю: Cloudflare шле трафік через живий, якщо другий
      # завис чи перезапускається. Кожен тримає по 4 з'єднання до різних дата-центрів.
      replicas: 2
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
