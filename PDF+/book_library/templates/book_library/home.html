{% extends "base.html" %}

{% block title %}PDF+ — спільна бібліотека{% endblock %}

{% block content %}
<div class="py-5 text-center">
  <h1 class="display-6 fw-semibold">PDF+</h1>
  <p class="lead text-body-secondary">Бібліотека PDF з анотаціями та спільним доступом.</p>

  {% if user.is_authenticated %}
    <p class="mb-0">Вітаємо, <strong>{{ user.username }}</strong>.</p>
  {% else %}
    <div class="d-flex gap-2 justify-content-center mt-4">
      <a href="{% url 'accounts:register' %}" class="btn btn-primary">Створити акаунт</a>
      <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary">Увійти</a>
    </div>
  {% endif %}
</div>
{% endblock %}
