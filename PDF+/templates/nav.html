<nav class="navbar navbar-expand-lg bg-body border-bottom sticky-top">
  <div class="container-fluid px-3 px-lg-4">

    {% if user.is_authenticated %}
      <button class="btn btn-link text-body d-lg-none px-2" type="button"
              data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-label="Меню">
        <i class="bi bi-list fs-4"></i>
      </button>
    {% endif %}

    <a class="navbar-brand fw-semibold" href="{% url 'book_library:home' %}">
      <i class="bi bi-file-earmark-pdf text-danger me-1"></i>PDF+
    </a>

    <div class="ms-auto d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <div class="dropdown">
          <button class="btn btn-light btn-sm dropdown-toggle d-flex align-items-center gap-2"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <span class="d-none d-sm-inline">{{ user.username }}</span>
            <span class="badge text-bg-secondary">{{ user.get_role_display }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">Профіль</a></li>
            <li><a class="dropdown-item" href="{% url 'accounts:edit_profile' %}">Редагувати профіль</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item text-danger">Вийти</button>
              </form>
            </li>
          </ul>
        </div>
      {% else %}
        <a class="btn btn-link btn-sm text-body" href="{% url 'accounts:login' %}">Увійти</a>
        <a class="btn btn-primary btn-sm" href="{% url 'accounts:register' %}">Реєстрація</a>
      {% endif %}
    </div>

  </div>
</nav>
