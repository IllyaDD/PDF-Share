{# Очікує: request (context processor). Активний пункт визначається за request.resolver_match. #}
{% with url_name=request.resolver_match.url_name ns=request.resolver_match.namespace %}
<nav class="nav flex-column gap-1 py-3">

  <a class="nav-link rounded d-flex align-items-center gap-2 {% if url_name == 'library' or url_name == 'folder' %}active{% endif %}"
     href="{% url 'book_library:library' %}">
    <i class="bi bi-folder2-open"></i> Моя бібліотека
  </a>

  <a class="nav-link rounded d-flex align-items-center gap-2 {% if url_name == 'shared_with_me' %}active{% endif %}"
     href="{% url 'book_library:shared_with_me' %}">
    <i class="bi bi-people"></i> Поділилися зі мною
  </a>

  <hr class="my-2">

  <a class="nav-link rounded d-flex align-items-center gap-2 {% if ns == 'sharing' and url_name|slice:':5' == 'group' %}active{% endif %}"
     href="{% url 'sharing:group_list' %}">
    <i class="bi bi-mortarboard"></i> Групи
  </a>

  <a class="nav-link rounded d-flex align-items-center gap-2 {% if ns == 'sharing' and url_name|slice:':4' == 'link' %}active{% endif %}"
     href="{% url 'sharing:link_list' %}">
    <i class="bi bi-link-45deg"></i> Посилання
  </a>

  <hr class="my-2">

  <a class="nav-link rounded d-flex align-items-center gap-2 {% if ns == 'accounts' %}active{% endif %}"
     href="{% url 'accounts:profile' %}">
    <i class="bi bi-person"></i> Профіль
  </a>

</nav>

<div class="px-3 pb-3">
  <a href="{% url 'book_library:book_upload' %}" class="btn btn-primary w-100">
    <i class="bi bi-upload me-1"></i> Завантажити PDF
  </a>
</div>
{% endwith %}
