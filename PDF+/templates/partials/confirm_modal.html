{% load i18n static %}
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-confirm-title>{% translate "Підтвердити дію" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" data-confirm-text>{% translate "Дію не можна скасувати." %}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate "Скасувати" %}</button>
        <form method="post" data-confirm-form>
          {% csrf_token %}
          <button type="submit" class="btn btn-danger" data-confirm-submit>{% translate "Видалити" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/confirm-modal.js' %}" defer></script>
