{% load i18n static %}
{# variant="block" — повноширинна кнопка з підписом (вхід, реєстрація); без нього — кругла іконка. #}
{% if variant == "block" %}
  <a href="{% url 'accounts:google_login' %}" class="btn btn-google-block">
    <img src="{% static 'img/google.svg' %}" alt="" width="20" height="20">
    <span>{% translate "Увійти через Google" %}</span>
  </a>
{% else %}
  <div class="text-center">
    <a href="{% url 'accounts:google_login' %}" class="btn btn-outline-secondary btn-google rounded-circle"
       title="{% translate "Продовжити з Google" %}" aria-label="{% translate "Продовжити з Google" %}">
      <img src="{% static 'img/google.svg' %}" alt="" width="22" height="22">
    </a>
  </div>
{% endif %}
