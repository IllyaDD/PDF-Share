{# Картка можливості на вітальній сторінці: icon — клас Bootstrap Icons, title і text — уже перекладені. #}
<div class="col-md-6 col-xl-4">
  <div class="card h-100 border-0 shadow-sm">
    <div class="card-body">
      <div class="feature-icon rounded-3 d-inline-flex align-items-center justify-content-center mb-3">
        <i class="bi {{ icon }} fs-5" aria-hidden="true"></i>
      </div>
      <h3 class="h6 fw-semibold">{{ title }}</h3>
      <p class="small text-body-secondary mb-0">{{ text }}</p>
    </div>
  </div>
</div>
